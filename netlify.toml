[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.12.0 (see astro's package.json "engines").
  NODE_VERSION = "22"

# Astro's build.format "file" emits clean-URL-friendly files (e.g. tools/foo.html
# instead of tools/foo/index.html); Netlify serves those at /tools/foo natively,
# so no redirect rules are needed here.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
